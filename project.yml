name: iKeypadApp
options:
  bundleIdPrefix: com.hoque
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  iKeypadShared:
    path: Packages/iKeypadShared
targets:
  iKeypad:
    type: application
    platform: iOS
    sources:
      - path: iKeypad/Sources/iKeypad
      - path: iKeypadApp/Assets.xcassets
    dependencies:
      - package: iKeypadShared
    info:
      path: iKeypadApp/Info.plist
      properties:
        CFBundleDisplayName: Sidekey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Sidekey connects to the Sidekey app on your Mac to show its shortcut keys.
        NSBonjourServices:
          - _sidekey._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoque.sidekey
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C67LAFG9Q4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
    scheme:
      testTargets:
        - iKeypadTests
  iKeypadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iKeypad/Tests
    dependencies:
      - target: iKeypad
      - package: iKeypadShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hoque.sidekey.tests
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C67LAFG9Q4
  SidekeyMac:
    type: application
    platform: macOS
    sources:
      - path: iKeypadMac/Sources/iKeypadMac
      - path: SidekeyMac/Assets.xcassets
    dependencies:
      - package: iKeypadShared
    entitlements:
      path: SidekeyMac/Sidekey.entitlements
      properties:
        # Hardened runtime blocks Apple Events (the AppleScript keys) without this.
        com.apple.security.automation.apple-events: true
    info:
      path: SidekeyMac/Info.plist
      properties:
        CFBundleDisplayName: Sidekey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Sidekey runs the AppleScript actions on your keys, such as Play/Pause in Music.
        NSLocalNetworkUsageDescription: Sidekey listens for your iPad on the local network and over USB.
        NSBonjourServices:
          - _sidekey._tcp
    settings:
      base:
        PRODUCT_NAME: Sidekey
        PRODUCT_BUNDLE_IDENTIFIER: com.hoque.sidekey.mac
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C67LAFG9Q4
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
